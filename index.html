.person-anchor-row{background:#f7f2ff!important;box-shadow:inset 4px 0 0 var(--purple)}
.person-anchor-row .assignee-name{color:#4f2fae}
.person-anchor-row .assignee-name::after{content:"Finding work";display:inline-block;margin-left:8px;padding:2px 6px;border-radius:999px;background:#ede4ff;color:#5f3cc5;font-size:9px;font-weight:800;vertical-align:middle}
.person-anchor-row .timeline-cell{background:linear-gradient(90deg,rgba(116,71,247,.07),rgba(116,71,247,.025))}
.person-anchor-row .remaining{color:#6846cf!important;font-weight:800}
.schedule-shell.editing-session .published-bar{opacity:.24;filter:grayscale(.78)}
.schedule-shell.editing-session .published-bar.current-selected,
.schedule-shell.editing-session .published-bar.reassign-source{opacity:1;filter:none}
.schedule-shell.editing-session .draft-bar{opacity:1;filter:none}
.draft-bar{position:absolute;border:2px solid var(--purple)!important;border-radius:6px;height:24px;top:10px;display:flex;align-items:center;justify-content:space-between;padding:0 5px;z-index:8;font-size:10px;overflow:visible}
.draft-bar::before{content:"Draft";position:absolute;top:-16px;left:-2px;height:15px;line-height:15px;padding:0 5px;border-radius:4px 4px 0 0;background:var(--purple);color:white;font-size:8px;font-weight:800}
.draft-bar.overdue{background:#cc3f42;color:#fff}
.draft-bar.inprogress{background:#3d7edb;color:#fff}
.draft-bar.notstarted{background:#99968e;color:#fff}
.draft-bar.completed{background:#2e9c57;color:#fff}
.draft-bar.conflict{box-shadow:0 0 0 2px #d97706}
.draft-bar .conflict-label{position:absolute;right:2px;top:-17px;color:#8a5200;background:#fff4dd;border:1px solid #edc778;border-radius:4px;padding:1px 4px;font-size:8px}
.work-item.drafted{background:#f7f4ff;border-color:#d8caff;opacity:.68}
.work-item.drafted em{color:#603cc4;font-style:normal;font-weight:800}
.published-bar.reassign-source{outline:2px dashed var(--purple);outline-offset:1px}
.pending-source-label{position:absolute;top:1px;right:2px;font-size:8px;background:#efe8ff;color:#5e3fc1;border:1px solid #cdbbff;padding:1px 4px;border-radius:4px;z-index:5}

.planning-outlook-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:stretch;margin-top:8px}
.planning-outlook-chart{min-width:0}
.week-summary{background:#f4f0ff;border:1px solid #ddd2ff;border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.week-summary-head{display:flex;justify-content:space-between;align-items:center;color:#665c82;font-weight:700}
.week-demand{font-size:28px;line-height:1;color:#20173a}
.week-demand-label{display:block;margin-top:3px;font-size:11px;color:#665c82}
.week-summary-metrics{display:grid;gap:8px}
.week-summary-metrics>div{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-top:8px;border-top:1px solid #ddd2ff}
.week-summary-metrics b{font-size:18px;color:#20173a}
.week-summary-metrics span{font-size:10px;color:#665c82;text-align:right}
.week-summary p{margin:0;padding-top:10px;border-top:1px solid #ddd2ff;color:#51466d;line-height:1.45}

.current-assignee-row{background:#f5f0ff;box-shadow:inset 4px 0 0 var(--purple)}
.current-assignee-row>.assignee-col{background:#f5f0ff}
.current-assignee-row>.assignee-col strong{color:#5732bd}
.current-assignee-row>.timeline-row{background:linear-gradient(90deg,rgba(116,71,247,.075),rgba(116,71,247,.025))}

.capacity-title{color:#5f3cc5}
.section-heading{display:flex;align-items:center;gap:7px}
.section-heading .section-symbol{font-size:15px;font-weight:900}
.portfolio-heading{color:#315ccf}.portfolio-heading .section-symbol{color:#315ccf}
.summary-heading{color:#9a5b12}.summary-heading .section-symbol{color:#c47a16}
.workspace-heading{color:#5a3db6}.workspace-heading .section-symbol{color:#7048d7}

.timeline-row{min-height:70px}
.published-bar,.proposed-bar,.draft-bar{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* v33 — existing Work / Task bars are selectable as well as draggable */
.published-bar[data-action="select-work"]{cursor:pointer}
.published-bar[data-action="select-work"][draggable="true"]{cursor:grab}

/* v34 — persistent right-side Work / Task context selection */
.published-bar[data-action="context-select"]{cursor:pointer}
.published-bar[data-action="context-select"][draggable="true"]{cursor:grab}
.published-bar[data-action="context-select"][draggable="true"]:active{cursor:grabbing}
.work-milestones{position:absolute;inset:0;pointer-events:none;overflow:visible}

.published-bar.has-work-milestones,.proposed-bar.has-work-milestones,.draft-bar.has-work-milestones{overflow:visible!important}
.published-bar.context-dim{opacity:.16!important;filter:grayscale(.55)!important}

.published-bar.context-parent{opacity:1!important;filter:none!important;box-shadow:0 0 0 2px rgba(79,47,215,.72);z-index:9}

.timeline-row.context-empty-target{cursor:default}

/* v35 — Local Task Work / Milestone context + global typography normalization */
.task-local-context{
  position:absolute;
  left:50%;
  top:auto;
  bottom:calc(100% + 8px);
  transform:translateX(-50%);
  width:max-content;
  min-width:230px;
  max-width:330px;
  padding:8px 10px 7px;
  border:1px solid #d8d0ef;
  border-radius:8px;
  background:rgba(255,255,255,.98);
  box-shadow:0 7px 20px rgba(31,27,54,.14);
  color:var(--text);
  z-index:30;
  pointer-events:none;
  white-space:normal;
}
.task-local-context.below{top:calc(100% + 8px);bottom:auto}
.task-local-context .task-context-work{font-size:11px;font-weight:700;line-height:1.25;color:#29233a;margin-bottom:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task-context-milestones{position:relative;display:flex;align-items:flex-start;gap:12px;padding-top:1px}
.task-context-milestone{min-width:48px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#898297}
.task-context-milestone .ctx-tick{display:block;width:2px;height:15px;border-radius:2px;background:#8d93a0}
.task-context-milestone .ctx-name{font-size:9px;font-weight:650;line-height:1.15;white-space:nowrap;color:#737a89}
.task-context-milestone .ctx-this{font-size:8px;line-height:1.1;color:transparent;font-weight:700;white-space:nowrap}
.task-context-milestone.active{color:#4f2fd7}
.task-context-milestone.active .ctx-tick{width:3px;background:#4f2fd7;box-shadow:0 0 0 2px rgba(79,47,215,.10)}
.task-context-milestone.active .ctx-name,.task-context-milestone.active .ctx-this{color:#4f2fd7}
.published-bar.has-local-task-context{overflow:visible!important}

/* Dark titles on status fills. Every status colour comes from one token so the
   legend swatch and the bar can never drift apart. */
.published-bar{

}
.published-bar.overdue{background:var(--status-overdue)}
.published-bar.inprogress{background:var(--status-in-progress)}
.published-bar.notstarted{background:var(--status-not-started)}
.published-bar.completed{background:var(--status-completed)}
.published-bar.atrisk{background:var(--status-at-risk);color:#15182b!important;border:2px solid var(--status-at-risk-accent)}
.proposed-bar,.draft-bar{color:#15182b}
.legend-dot.red{background:var(--status-overdue)}
.legend-dot.blue{background:var(--status-in-progress)}
.legend-dot.yellow{background:var(--status-at-risk-accent)}
.legend-dot.gray{background:var(--status-not-started)}
.legend-dot.green{background:var(--status-completed)}
.draft-overdue{background:var(--status-overdue);color:#15182b}
.draft-neutral{background:var(--status-not-started);color:#15182b}
.draft-atrisk{background:var(--status-at-risk);color:#15182b}
.draft-progress{background:var(--status-in-progress);color:#15182b}
/* Calendar uses the same tokens. Calendar bars keep white text, so they use the
   -solid variants: same hue family, dark enough for white type. */
.calendar-work-bar.overdue,.calendar-draft-bar.overdue{background:var(--status-overdue-solid);color:#fff}
.calendar-work-bar.inprogress,.calendar-draft-bar.inprogress{background:var(--status-in-progress-solid);color:#fff}
.calendar-work-bar.notstarted,.calendar-draft-bar.notstarted{background:var(--status-not-started-solid);color:#fff}
.calendar-work-bar.completed,.calendar-draft-bar.completed{background:var(--status-completed-solid);color:#fff}
.calendar-work-bar.atrisk{background:var(--status-not-started-solid);color:#fff;border:2px solid var(--status-at-risk-accent)}
.calendar-draft-bar.atrisk{background:var(--status-not-started-solid);color:#fff;box-shadow:inset 0 0 0 2px var(--status-at-risk-accent)}
.work-bar{
  height:42px!important;
  padding:4px 8px 16px!important;
  align-items:flex-start!important;
  overflow:visible!important;
}
.work-bar>.bar-title{
  position:relative;
  z-index:5;
  display:block;
  max-width:100%;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  line-height:15px;
}
.task-bar>.bar-title{
  display:block;
  max-width:100%;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}
.work-milestones{
  position:absolute;
  inset:0;
  overflow:visible;
  pointer-events:none;
  z-index:7;
}
.work-milestone{
  position:absolute;
  top:0;
  height:100%;
  transform:translateX(-50%);
  z-index:7;
  display:block;
}
.work-milestone .milestone-dot{
  position:absolute;
  top:-3px;
  left:-3px;
  width:6px;
  height:6px;
  border-radius:50%;
  background:#fff;
  box-shadow:0 0 0 1px rgba(42,46,58,.18);
}
.work-milestone .milestone-stem{
  position:absolute;

  left:-1px;

  height:9px;

}

  display:block!important;

}

}

}

    state.publishedAssignments.forEach(pub=>{

    const DAY_MS=86400000, DAY_WIDTH=88, TIMELINE_DAYS=29, TIMELINE_WIDTH=DAY_WIDTH*TIMELINE_DAYS;

    const dateLabels=[]; for(let i=0;i<29;i++){const dt=new Date(rangeStart.getTime()+i*86400000); const mon=dt.toLocaleString('en-US',{month:'short'}); const day=dt.getDate(); dateLabels.push(`<span class="${i===14?'today-head':''}">${i===14?'Today · ':''}${mon} ${day}</span>`)}

(function(){
  const CP=window.CP,STD=[0,8,8,8,8,8,0],DN=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const sum=a=>a.reduce((s,v)=>s+(Number(v)||0),0);
  const fmt=iso=>new Date(iso+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});
  const add=(iso,n)=>{const d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
  const esc=t=>String(t==null?'':t).replace(/"/g,'&quot;');
  const TODAY='2026-09-09';

  /* ---------- shared availability context ----------
     One abstraction over "my own availability" and "a team member's availability"
     so both pages run through the SAME editor and the SAME maths.             */
  CP.avContext=function(state){
    if(state.teamPersonId){
      const p=(state.team||[]).find(x=>x.id===state.teamPersonId);
      if(p) return {kind:'team',person:p,wi:state.teamPersonWeek,isSelf:false,name:p.name};
    }
    return {kind:'self',person:null,wi:state.availabilityWeek,isSelf:true,name:'You'};
  };
  CP.avRecurring=function(state,ctx){
    return ctx.kind==='self'?Number(state.availability.recurringOverhead)||0:Number(ctx.person.recurringOverhead)||0;
  };
  /* Lazily materialise a week. Absent week => standard week + recurring overhead.
     maintained:false people therefore compute on 40 h / 0 overhead, they are
     flagged, never blanked.                                                    */
  CP.avWeek=function(state,ctx,wi){
    const key=String(wi), rec=CP.avRecurring(state,ctx);
    const store=ctx.kind==='self'?state.availability.weeks:ctx.person.weeks;
    if(!store[key]) store[key]={days:STD.slice(),notes:{},overhead:rec};
    const w=store[key];
    if(w.overhead==null) w.overhead=rec;
    if(!w.notes) w.notes={};
    return w;
  };
  CP.avHasOverride=function(state,ctx,wi){
    const store=ctx.kind==='self'?state.availability.weeks:ctx.person.weeks;
    return Object.prototype.hasOwnProperty.call(store,String(wi));
  };
  CP.avAssignedLines=function(state,ctx,wi){
    if(ctx.kind==='self'){
      const h=Number((state.availability.assigned||{})[String(wi)])||0;
      return h?[{workspaceId:'W1',workspaceName:'All workspaces',unit:'hours',hours:h}]:[];
    }
    return (ctx.person.assigned||{})[String(wi)]||[];
  };
  CP.avAssigned=function(state,ctx,wi){return sum(CP.avAssignedLines(state,ctx,wi).map(x=>Number(x.hours)||0))};
  CP.avIsAdjusted=function(state,ctx,wi){
    if(!CP.avHasOverride(state,ctx,wi)) return false;
    const w=CP.avWeek(state,ctx,wi), rec=CP.avRecurring(state,ctx);
    return w.days.some((v,i)=>Number(v)!==STD[i])||Number(w.overhead)!==rec||Object.keys(w.notes||{}).length>0;
  };
  CP.avLeft=function(state,ctx,wi){
    const w=CP.avHasOverride(state,ctx,wi)?CP.avWeek(state,ctx,wi):{days:STD,overhead:CP.avRecurring(state,ctx)};
    return sum(w.days)-CP.avAssigned(state,ctx,wi)-(Number(w.overhead)||0);
  };
  /* legacy signature kept so older callers keep working */
  CP.availabilityIsAdjusted=(state,wi)=>CP.avIsAdjusted(state,{kind:'self',person:null,isSelf:true},wi);

  /* ---------- the four shared cards ---------- */

  /* ---------- Layer 1 — roster ---------- */
  CP.teamVisible=function(state){
    let list=(state.team||[]).filter(p=>state.teamScope==='reports'?p.isReport:true);
    if(state.teamUnmanagedOnly) list=list.filter(p=>!p.maintained);
    return list;
  };
  function cellFor(state,p,off){
    const ctx={kind:'team',person:p,wi:off,isSelf:false,name:p.name};
    return {left:CP.avLeft(state,ctx,off),override:CP.avIsAdjusted(state,ctx,off)};
  }
  CP.renderTeamRoster=function(state){
    const w0=state.teamWindow, offs=[0,1,2,3,4,5].map(i=>w0+i);
    const first=CP.weekByOffset(offs[0]), last=CP.weekByOffset(offs[5]);
    const list=CP.teamVisible(state);
    const unmanagedCount=(state.team||[]).filter(p=>(state.teamScope==='reports'?p.isReport:true)&&!p.maintained).length;

    const head='<div class="roster-head"><div>Person</div>'+offs.map(o=>'<div class="'+(o<0?'past-col':'')+'">'+CP.weekByOffset(o).short+(o<0?' · closed':'')+'</div>').join('')+'</div>';

    const rowFor=function(p){
      const cells=offs.map(o=>{
        const c=cellFor(state,p,o);
        const open=state.teamExpanded&&state.teamExpanded.id===p.id&&state.teamExpanded.off===o;
        return '<button class="roster-cell '+(c.left<0?'negative':'')+' '+(o<0?'past':'')+' '+(open?'open':'')+'" '
          +'data-action="team-expand" data-person="'+p.id+'" data-off="'+o+'">'+c.left+' h'
          +(c.override?'<span class="dot">·</span>':'')+'</button>';
      }).join('');
      let expand='';
      if(state.teamExpanded&&state.teamExpanded.id===p.id&&offs.indexOf(state.teamExpanded.off)>=0){
        const off=state.teamExpanded.off, ctx={kind:'team',person:p,wi:off,isSelf:false,name:p.name};
        const hasOv=CP.avHasOverride(state,ctx,off);
        const avail=hasOv?sum(CP.avWeek(state,ctx,off).days):40;
        const oh=hasOv?(Number(CP.avWeek(state,ctx,off).overhead)||0):(Number(p.recurringOverhead)||0);
        const lines=CP.avAssignedLines(state,ctx,off);
        const assigned=CP.avAssigned(state,ctx,off);
        const m=CP.weekByOffset(off);
        expand='<div class="roster-expand"><h4>Week of '+fmt(m.start)+'–'+fmt(m.end)+' · '+p.name+'</h4>'
          +'<div class="eq">'+avail+' available − '+assigned+' assigned − '+oh+' overhead = '+(avail-assigned-oh)+' h left</div>'
          +(lines.length?lines.map(l=>'<div class="ws-line"><span>'+CP.wsLabel(l.workspaceId)+(l.workspaceId===p.homeWorkspaceId?'':'<em class="away">other workspace</em>')+'</span><span>'+(Number(l.hours)||0)+' h</span></div>').join(''):'<div class="ws-line"><span>No assigned work</span><span>0 h</span></div>')
          +'<div class="ws-line total"><span>Assigned total</span><span>'+assigned+' h</span></div>'
          +'<div class="ws-unit-note">Every workspace reports in hours. Works-based workspaces are converted to hours before they reach this view.</div>'
          +'<div class="expand-actions"><button class="btn av-primary" data-action="team-open-person" data-person="'+p.id+'" data-off="'+off+'">Open '+p.name+' · Week of '+fmt(m.start)+' →</button></div>'
          +'</div>';
      }
      const others=p.otherWorkspaceIds||[];
      const badge=others.length
        ?'<span class="ws-badge" title="Also assigned in: '+esc(others.map(CP.wsLabel).join(', '))+'">'
          +(others.length===1?('also in '+CP.wsShort(others[0])):('also in '+others.length+' workspaces'))+'</span>'
        :'';
      return '<div class="roster-row">'
        +'<button class="roster-name" data-action="team-open-person" data-person="'+p.id+'" data-off="'+state.teamWindow+'">'
        +(p.maintained?'':'<span class="warn" title="Never maintained — using the 40 h standard week and 0 h overhead. Numbers may not reflect actual availability.">⚠</span>')
        +'<strong>'+p.name+'</strong>'+badge+'</button>'+cells+'</div>'+expand;
    };

    /* Grouped by home workspace. A person appears exactly once, under the
       workspace they were placed in — the hours in the row are still their
       whole week across every workspace, not this workspace's slice.       */
    const order=Object.keys(CP.workspaceSeeds);
    const groups=order.map(id=>({id:id,people:list.filter(p=>p.homeWorkspaceId===id)}));
    const orphans=list.filter(p=>!p.homeWorkspaceId||order.indexOf(p.homeWorkspaceId)<0);
    if(orphans.length) groups.push({id:null,people:orphans});
    const rows=groups.filter(g=>g.people.length).map(g=>
      '<div class="roster-group"><strong>'+(g.id?CP.wsLabel(g.id):'No workspace')+'</strong>'
      +'<span>'+g.people.length+(g.people.length===1?' person':' people')+'</span></div>'
      +g.people.map(rowFor).join('')
    ).join('');

    return '<div class="team-shell">'
      +'<div class="team-bar">'
      +'<button class="btn" data-action="team-prev" '+(w0<=CP.MIN_WEEK?'disabled':'')+'>‹</button>'
      +'<span class="week-title">Week of '+fmt(first.start)+' – '+fmt(last.end)+'</span>'
      +'<button class="btn" data-action="team-next" '+(w0>=0?'disabled':'')+'>›</button>'
      +'<span class="team-scope">Scope <select id="teamScope"><option value="reports" '+(state.teamScope==='reports'?'selected':'')+'>My Reports</option><option value="all" '+(state.teamScope==='all'?'selected':'')+'>All people</option></select></span>'
      +'<span class="spacer"></span>'
      +(unmanagedCount?'<button class="unmanaged-toggle '+(state.teamUnmanagedOnly?'active':'')+'" data-action="team-unmanaged">⚠ '+unmanagedCount+' unmanaged</button>':'')
      +'</div>'
      +'<p class="team-note">People are grouped by their home workspace and each person appears only once. A badge marks anyone who also carries work in another workspace. Each cell is what is left that week across <b>all</b> workspaces: available − assigned − overhead. Click a cell for the workspace breakdown, or a name to open that person. Weeks before this one are closed and read-only.</p>'
      +'<div class="roster">'+head+(rows||'<div class="roster-expand">No one matches this filter.</div>')+'</div>'
      +(unmanagedCount&&!state.teamUnmanagedOnly?'<div class="unmanaged-banner"><b>⚠ '+unmanagedCount+' person'+(unmanagedCount===1?'':'s')+' never maintained.</b> Their rows are calculated from the 40 h standard week and 0 h overhead, so the numbers may not reflect actual availability. They are still shown, not hidden — open each person to set a real week.</div>':'')
      +'</div>';
  };

})();

      const same=state.contextSelection&&state.contextSelection.objectId===next.objectId&&state.contextSelection.objectType===next.objectType;
      state.contextSelection=same?null:next;
      // Center on every NEW selection, Work or Task. Re-clicking the same bar
      // toggles the selection off and must never trigger a second centering.
      pendingContextFocusId=same?null:next.objectId;
    }
    if(a==='select-work'){
      const id=el.dataset.id,cur=state.selectedGanttWorkIds||[];
      state.selectedGanttWorkIds=cur.includes(id)?cur.filter(x=>x!==id):[...cur,id];
      state.selectedWorkId=state.selectedGanttWorkIds[state.selectedGanttWorkIds.length-1]||null;
    }
    if(a==='draft-here'){
      if(el.dataset.work)state.selectedWorkId=el.dataset.work;
      createDraft(el.dataset.person);
    }
    if(a==='cancel-draft'){state.drafts=state.drafts.filter(x=>x.workId!==el.dataset.id);state.selectedWorkId=null;state.toast=state.drafts.length?'Draft change removed':'Draft changes cleared';}
    if(a==='cancel-all'){state.drafts=[];state.selectedWorkId=null;}
    if(a==='publish'){CP.publish(state);}
    if(a==='clear-toast'){state.toast=null;lastToastText=null;if(toastTimer){clearTimeout(toastTimer);toastTimer=null;}}
    render();
  });
  app.addEventListener('change',e=>{
    if(e.target.name==='pwhMode'){state.config.pwhMode=e.target.value;render();}
    if(e.target.name==='scheduleRequirement'){state.config.scheduleRequirement=e.target.value;render();}
    if(e.target.id==='scheduleFieldSelect'){state.config.scheduleField=e.target.value;}
    if(e.target.id==='dueDateFieldSelect'){state.config.dueDateField=e.target.value;}
    if(e.target.id==='wholeHoursInput'){state.config.wholeHours=Number(e.target.value)||0;}
    if(e.target.matches('[data-status-hours]')){state.config.statusRoles[e.target.dataset.status].hours=Number(e.target.value)||0;}
    if(e.target.matches('[data-action="status-role-mode"]')){state.config.statusRoles[e.target.dataset.status].mode=e.target.value;render();}
    if(e.target.id==='workspaceSelect'||e.target.name==='scheduleWorkspace'){state.workspaceId=e.target.value;state.selectedWorkId=null;state.selectedGanttWorkIds=[];state.selectedCalendarWorkIds=[];state.selectedCalendarAssigneeIds=[];state.calendarWeekOffset=0;state.workTypeFilter='All types';state.contextSelection=null;render();}
    if(e.target.id==='workTypeSelect'){state.workTypeFilter=e.target.value;state.selectedWorkId=null;render();}
    if(e.target.matches('[data-av-day]')){const c=CP.avContext(state);if(c.wi<0)return;const i=+e.target.dataset.avDay;
      CP.avWeek(state,c,c.wi).days[i]=Math.max(0,Number(e.target.value)||0);
      if(c.kind==='team')c.person.maintained=true;
      state.availability.floorMessage='';render();}
    if(e.target.id==='teamScope'){state.teamScope=e.target.value;state.teamExpanded=null;render();}
    if(e.target.id==='avRecurring'){state.teamRecurringDraft=Math.max(0,Number(e.target.value)||0);}
    if(e.target.id==='avWeeklyTotal'){rebalanceAvailability(Number(e.target.value));render();}
    if(e.target.id==='avOverhead'){const c=CP.avContext(state);if(c.wi<0)return;
      CP.avWeek(state,c,c.wi).overhead=Math.max(0,Number(e.target.value)||0);
      if(c.kind==='team')c.person.maintained=true;render();}
    if(e.target.id==='timeOffFrom'){state.availability.timeOff.from=e.target.value;}
    if(e.target.id==='timeOffTo'){state.availability.timeOff.to=e.target.value;}
    if(e.target.id==='timeOffAmount'){state.availability.timeOff.amount=e.target.value;render();}
    if(e.target.id==='timeOffCustom'){state.availability.timeOff.custom=Math.max(0,Number(e.target.value)||0);}
    if(e.target.id==='timeOffReason'){state.availability.timeOff.reason=e.target.value;}
  });
  app.addEventListener('input',e=>{
    if(e.target.id==='workSearch'){state.searchTerm=e.target.value;render(); const inp=document.getElementById('workSearch'); if(inp){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length);}}
  });

  function rebalanceAvailability(requested){
    const av=state.availability,c=CP.avContext(state),wi=c.wi;
    if(wi<0)return;
    const w=CP.avWeek(state,c,wi),today=new Date(av.today+'T00:00:00'),start=CP.weekByOffset(wi).start;
    if(c.kind==='team')c.person.maintained=true;
    const dates=Array.from({length:7},(_,i)=>{const d=new Date(start+'T00:00:00');d.setDate(d.getDate()+i);return d}),locked=dates.map(d=>d<today),lockedHours=w.days.reduce((s,v,i)=>s+(locked[i]?Number(v)||0:0),0);
    let target=Math.max(0,Number(requested)||0);if(target<lockedHours){target=lockedHours;av.floorMessage=`This week cannot go below ${lockedHours} h because those hours are already worked.`;}else av.floorMessage='';
    const eligible=w.days.map((v,i)=>!locked[i]&&Number(v)>0?i:-1).filter(i=>i>=0);if(!eligible.length)return;
    const remaining=Math.max(0,target-lockedHours),base=Math.floor((remaining/eligible.length)*2)/2,rem=Math.round((remaining-base*eligible.length)*2)/2;eligible.forEach((i,idx)=>w.days[i]=base+(idx===0?rem:0));
  }
  function applyTimeOff(){
    const av=state.availability,c=CP.avContext(state);
    const from=new Date(av.timeOff.from+'T00:00:00'),to=new Date(av.timeOff.to+'T00:00:00');
    if(!av.timeOff.from||!av.timeOff.to||to<from){av.timeOffConfirm='Choose a valid date range.';return;}
    const touched=new Set();let changed=0;
    for(let d=new Date(from);d<=to;d.setDate(d.getDate()+1)){
      const dow=d.getDay();if(dow===0||dow===6)continue;
      const iso=d.toISOString().slice(0,10);
      let wi=null;
      for(let o=0;o<=CP.MAX_WEEK;o++){const wk=CP.weekByOffset(o);if(iso>=wk.start&&iso<=wk.end){wi=o;break;}}
      if(wi===null)continue;
      let val=0;if(av.timeOff.amount==='Half day')val=4;else if(av.timeOff.amount==='Custom hours')val=Math.max(0,Number(av.timeOff.custom)||0);
      const w=CP.avWeek(state,c,wi);
      w.days[dow]=val;
      if((av.timeOff.reason||'').trim())w.notes[dow]=av.timeOff.reason.trim();
      touched.add(wi);changed++;
    }
    if(c.kind==='team'&&changed)c.person.maintained=true;
    const who=c.kind==='team'?(' for '+c.name):'';
    av.timeOffConfirm=`Applied${who} to ${changed} weekday${changed===1?'':'s'} across ${touched.size} week${touched.size===1?'':'s'}.`;
  }

  function createDraft(personId,fromOverride=null){
    if(!state.selectedWorkId)return;
    const workId=state.selectedWorkId;
    const existing=state.drafts.findIndex(x=>x.workId===workId);
    const w=[...state.work,...state.phasedFromUnphased].find(x=>x.id===workId);
    const pub=state.publishedAssignments.find(x=>x.workId===workId);
    const fromPersonId=fromOverride||(pub?pub.toPersonId:(w&&w.assignedTo?w.assignedTo:null));
    if(fromPersonId&&fromPersonId===personId){state.selectedWorkId=null;return;}
    const item={workId,toPersonId:personId,fromPersonId}; if(existing>=0)state.drafts[existing]=item; else state.drafts.push(item); state.selectedGanttWorkIds=(state.selectedGanttWorkIds||[]).filter(id=>id!==workId);state.selectedCalendarWorkIds=(state.selectedCalendarWorkIds||[]).filter(id=>id!==workId);state.selectedWorkId=null; state.toast=`Draft created · ${state.drafts.length} unpublished change${state.drafts.length>1?'s':''}`;
  }
  function positionLocalTaskContext(){
    const pop=document.querySelector('[data-task-local-context]');
    if(!pop)return;
    const bar=pop.closest('.published-bar');
    const gantt=pop.closest('.gantt');
    if(!bar||!gantt)return;

    // Keep the callout physically attached to the Task. Prefer above, flip below only
    // when the sticky Gantt header would otherwise cover it.
    pop.classList.remove('below');
    pop.style.left='50%';
    pop.style.transform='translateX(-50%)';
    const ganttRect=gantt.getBoundingClientRect();
    const head=gantt.querySelector('.gantt-head');
    const headBottom=head?head.getBoundingClientRect().bottom:ganttRect.top;
    const initial=pop.getBoundingClientRect();
    if(initial.top<Math.max(ganttRect.top,headBottom)+8)pop.classList.add('below');

    // A small edge nudge is allowed, but never move the context so far that it
    // stops feeling attached to the selected Task. Auto-centering handles the rest.
    const rect=pop.getBoundingClientRect();
    const barRect=bar.getBoundingClientRect();
    const margin=8,maxNudge=52;
    let delta=0;
    if(rect.left<ganttRect.left+margin)delta=(ganttRect.left+margin)-rect.left;
    else if(rect.right>ganttRect.right-margin)delta=(ganttRect.right-margin)-rect.right;
    delta=Math.max(-maxNudge,Math.min(maxNudge,delta));
    if(delta){
      const currentLeft=barRect.width/2;
      pop.style.left=`${currentLeft+delta}px`;
    }
  }

  /* The ONLY responsibility of this function is to centre the exact element the
     user clicked. It knows nothing about hierarchy, parents or milestones. */
  function centerContextBar(bar){
    if(!bar)return false;
    const gantt=bar.closest('.gantt');
    if(!gantt)return false;
    const ganttRect=gantt.getBoundingClientRect();
    const barRect=bar.getBoundingClientRect();
    if(!barRect.width&&!barRect.height)return false;

    // Usable timeline viewport excludes the sticky Assignee column on the left
    // and the sticky timeline header at the top. Both are measured, not assumed.
    const head=gantt.querySelector('.gantt-head');
    const headHeight=head?head.getBoundingClientRect().height:0;
    const col=gantt.querySelector('.gantt-head .assignee-col')||gantt.querySelector('.assignee-col');
    const colWidth=col?col.getBoundingClientRect().width:190;

    const visibleLeft=ganttRect.left+colWidth;
    const visibleRight=ganttRect.left+gantt.clientWidth;
    const visibleTop=ganttRect.top+headHeight;
    const visibleBottom=ganttRect.top+gantt.clientHeight;
    if(visibleRight<=visibleLeft||visibleBottom<=visibleTop)return false;

    const targetX=(visibleLeft+visibleRight)/2;
    const targetY=(visibleTop+visibleBottom)/2;

    // Bar CENTRE, not bar start — a long bar centres on its midpoint.
    const deltaX=(barRect.left+barRect.width/2)-targetX;
    const deltaY=(barRect.top+barRect.height/2)-targetY;

    const maxLeft=Math.max(0,gantt.scrollWidth-gantt.clientWidth);
    const maxTop=Math.max(0,gantt.scrollHeight-gantt.clientHeight);
    const left=Math.max(0,Math.min(maxLeft,gantt.scrollLeft+deltaX));
    const top=Math.max(0,Math.min(maxTop,gantt.scrollTop+deltaY));

    gantt.scrollTo({left,top,behavior:'smooth'});
    return true;
  }
  CP.centerContextBar=centerContextBar;

  function findContextBar(id){
    const gantt=document.querySelector('.schedule-main:not(.view-hidden) .gantt')||document.querySelector('.gantt');
    if(!gantt)return null;
    const sel=gantt.querySelector('.published-bar.context-selected[data-action="context-select"]');
    if(sel&&sel.dataset.id===id)return sel;
    return Array.from(gantt.querySelectorAll('.published-bar[data-action="context-select"]')).find(el=>el.dataset.id===id)||null;
  }

  /* One centering operation per intentional selection event. The id is consumed
     immediately so later renders, scrolls and context repositioning never
     re-centre. */
  function centerPendingContextBar(){
    const id=pendingContextFocusId;
    pendingContextFocusId=null;
    if(!id){positionLocalTaskContext();return;}
    const bar=findContextBar(id);
    if(!bar){positionLocalTaskContext();return;}
    requestAnimationFrame(()=>{
      centerContextBar(bar);
      positionLocalTaskContext();
      setTimeout(positionLocalTaskContext,300);
    });
  }

  function wireContextViewport(){
    const gantt=document.querySelector('.gantt');
    if(!gantt)return;
    let raf=0;
    gantt.addEventListener('scroll',()=>{
      if(raf)return;
      raf=requestAnimationFrame(()=>{raf=0;positionLocalTaskContext();});
    },{passive:true});
  }


  function wireDrag(){
    // Gantt drag/drop.
    document.querySelectorAll('.work-item[draggable="true"]').forEach(el=>el.addEventListener('dragstart',ev=>{
      state.selectedWorkId=el.dataset.id;
      ev.dataTransfer.effectAllowed='move';
      ev.dataTransfer.setData('text/plain',el.dataset.id);
      setTimeout(render,0);
    }));
    document.querySelectorAll('[data-drop-person]').forEach(el=>{
      el.addEventListener('dragover',ev=>ev.preventDefault());
      el.addEventListener('drop',ev=>{
        ev.preventDefault();
        state.selectedWorkId=ev.dataTransfer.getData('text/plain');
        const from=ev.dataTransfer.getData('application/x-reassign-from')||null;
        createDraft(el.dataset.dropPerson,from);
        render();
      });
    });

    // Direct reassignment: drag any existing published Work/Task bar to another assignee.
    document.querySelectorAll('[data-reassign-work][draggable="true"]').forEach(el=>{
      el.addEventListener('dragstart',ev=>{
        const workId=el.dataset.reassignWork;if(!workId)return;
        state.suppressContextClick=true;
        ev.dataTransfer.effectAllowed='move';
        ev.dataTransfer.setData('text/plain',workId);
        ev.dataTransfer.setData('application/x-reassign-from',el.dataset.reassignFrom||'');
        el.classList.add('dragging-reassign');
      });
      el.addEventListener('dragend',()=>{el.classList.remove('dragging-reassign');setTimeout(()=>{state.suppressContextClick=false;},120);});
    });

    // Calendar drag/drop. Drag one specific Work/Task card to any visible Assignee row.
    document.querySelectorAll('[data-calendar-drag-work][draggable="true"]').forEach(el=>{
      el.addEventListener('dragstart',ev=>{
        const workId=el.dataset.calendarDragWork;
        ev.dataTransfer.effectAllowed='move';
        ev.dataTransfer.setData('text/plain',workId);
        el.classList.add('dragging');
      });
      el.addEventListener('dragend',()=>el.classList.remove('dragging'));
    });
    document.querySelectorAll('[data-calendar-drop-person]').forEach(el=>{
      el.addEventListener('dragenter',ev=>{
        ev.preventDefault();
        el.classList.add('calendar-drop-target');
      });
      el.addEventListener('dragover',ev=>{
        ev.preventDefault();
        ev.dataTransfer.dropEffect='move';
        el.classList.add('calendar-drop-target');
      });
      el.addEventListener('dragleave',ev=>{
        if(!el.contains(ev.relatedTarget))el.classList.remove('calendar-drop-target');
      });
      el.addEventListener('drop',ev=>{
        ev.preventDefault();
        el.classList.remove('calendar-drop-target');
        const workId=ev.dataTransfer.getData('text/plain');
        if(!workId)return;
        const work=[...state.work,...state.phasedFromUnphased].find(x=>x.id===workId);
        const from=ev.dataTransfer.getData('application/x-reassign-from')||null;
        state.selectedWorkId=workId;
        createDraft(el.dataset.calendarDropPerson,from);
        state.selectedCalendarWorkIds=state.selectedCalendarWorkIds.filter(id=>id!==workId);
        if(work)state.calendarWeekOffset=calendarOffsetForDate(work.start);
        render();
      });
    });
  }
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'&&state.contextSelection){state.contextSelection=null;render();}
  });
  render();
})();
